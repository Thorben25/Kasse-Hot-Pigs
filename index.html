  function relativeTime(iso) {
    var diffMs = Date.now() - new Date(iso).getTime();

    if (min < 1) return "gerade eben";

    var h = Math.floor(min / 60);
    if (h < 24) return "vor " + h + " Std";
    var d = Math.floor(h / 24);
    if (d < 7) return "vor " + d + " Tag" + (d === 1 ? "" : "en");
    return new Date(iso).toLocaleDateString("de-DE");

  var syncChain = Promise.resolve();

  function save(opts) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (opts && opts.skipSync) return;
    syncPending = true;
    setSyncStatus("saving");
    syncChain = syncChain.then(function () {
      var payload = JSON.stringify(state);
      return fetch(SYNC_URL, {
        method: "POST",
        headers: { "content-type": "application/json", "x-sync-secret": SYNC_SECRET },
        body: payload
      }).then(function (r) {
        if (!r.ok) throw new Error("bad status");
        return r.json();
      }).then(function (res) {
        state.updatedAt = res.updatedAt;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        syncPending = false;
        setSyncStatus("synced");
      });
    }).catch(function () { syncPending = false; setSyncStatus("offline"); });
  }

          (function () { var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("width", "16"); s.setAttribute("height", "16");
            s.setAttribute("class", "chevron"); s.innerHTML = '<path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
            return s; })()
        ]);
        row.appendChild(right);

        var detail = el("div", { class: "breakdown", style: "display:none;padding:0 14px 14px;" });
        m.rows.slice().sort(function (a, b) { return b.guthaben - a.guthaben; }).forEach(function (r) {
          if (r.verbraucht === 0 && r.guthaben === 0) return;
          var line = el("div", {}, [text(r.name), text((r.guthaben < 0 ? "zahlt " : r.guthaben > 0 ? "bekommt " : "") + euro(Math.abs(r.guthaben)))]);
          detail.appendChild(line);
        });
        row.addEventListener("click", function () { detail.style.display = detail.style.display === "none" ? "block" : "none"; });

        var container = el("div", {});
        container.appendChild(row); container.appendChild(detail);
        card.appendChild(container);
      });
    }
    wrap.appendChild(card);

    wrap.appendChild(el("h2", { class: "section-title" }, [text("Aktuelle Periode")]));
    var closeCard = el("div", { class: "card" });
    var closeForm = el("div", { class: "entry-form" });
    closeForm.appendChild(el("p", { style: "margin:0;font-size:0.85rem;color:var(--ink-muted);" },
      [text("Erzeugt aus dem aktuellen Stand eine Abrechnung, speichert sie im Verlauf, setzt \"Erfassen\" auf Null zurück (offene Guthaben werden automatisch als neuer Vortrag übernommen) und öffnet direkt den PDF-Export.")]));
    var closeBtn = el("button", { class: "btn-primary" }, [text("Abrechnung erzeugen")]);
    closeBtn.addEventListener("click", openCloseModal);
    closeForm.appendChild(closeBtn);
    closeCard.appendChild(closeForm);
    wrap.appendChild(closeCard);

    wrap.appendChild(el("h2", { class: "section-title" }, [text("Letzte Aktivität")]));
    var activityCard = el("div", { class: "card" });
    var log = Array.isArray(state.activityLog) ? state.activityLog : [];
    if (log.length === 0) {
      activityCard.appendChild(el("div", { class: "empty-hint" }, [text("Noch keine Aktivität aufgezeichnet.")]));
    } else {
      log.slice(0, 15).forEach(function (entry, idx) {
        var row = el("div", { class: "activity-row" });
        if (idx > 0) row.style.borderTop = "1px solid var(--border)";
        row.appendChild(el("span", { class: "txt" }, [text(entry.text)]));
        row.appendChild(el("span", { class: "when" }, [text(relativeTime(entry.ts))]));
        activityCard.appendChild(row);
      });
    }
    wrap.appendChild(activityCard);

    return wrap;
  }

  function viewVerwalten() {
    var wrap = el("div", {});

    wrap.appendChild(el("h2", { class: "section-title" }, [text("Personen")]));
    var peopleCard = el("div", { class: "card" });
    state.people.slice().sort(function (a, b) { return a.name.localeCompare(b.name, "de"); }).forEach(function (p, idx) {
      var row = el("div", { class: "person-manage-row" });
      if (idx > 0) row.style.borderTop = "1px solid var(--border)";
      row.appendChild(el("div", { style: "flex:1;font-weight:600;" }, [text(p.name)]));
      var del = el("button", { class: "icon-btn", "aria-label": "Entfernen" }, []);
      del.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-1 13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7"/></svg>';
      del.addEventListener("click", function () {
        if (!confirm(p.name + " wirklich entfernen? Alle Daten dieser Person gehen verloren.")) return;
        state.people = state.people.filter(function (x) { return x.id !== p.id; });
        delete state.period.vortrag[p.id]; delete state.period.drinks[p.id];
        state.period.einkaufe = state.period.einkaufe.filter(function (e) { return e.personId !== p.id; });
        logActivity("Person entfernt: " + p.name);
        save(); renderMain();
      });
      row.appendChild(del);
      peopleCard.appendChild(row);
    });
    var addRow = el("div", { class: "entry-form", style: "padding-top:10px;" });
    var addInput = el("input", { type: "text", placeholder: "Neue Person…" });
    var addBtn = el("button", { class: "btn-secondary" }, [text("Hinzufügen")]);
    addBtn.addEventListener("click", function () {
      var n = addInput.value.trim();
      if (!n) return;
      var p = { id: uid(), name: n };
      state.people.push(p); state.period.vortrag[p.id] = 0; state.period.drinks[p.id] = 0;
      logActivity("Person hinzugefügt: " + n);
      addInput.value = ""; save(); renderMain();
    });
    addRow.appendChild(addInput); addRow.appendChild(addBtn);
    peopleCard.appendChild(addRow);
    wrap.appendChild(peopleCard);

    wrap.appendChild(el("h2", { class: "section-title" }, [text("Einstellungen")]));
    var settingsCard = el("div", { class: "card settings-group" });

    var priceRow = el("div", { class: "settings-item" });
    priceRow.appendChild(el("div", {}, [el("div", { class: "lbl" }, [text("Preis pro Getränk")])]));
    var priceInput = el("input", { type: "number", step: "0.1", min: "0", style: "width:80px;text-align:right;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);", value: state.price });
    priceInput.addEventListener("change", function (e) {
      var v = parseFloat(String(e.target.value).replace(",", "."));
      if (v > 0 && v !== state.price) {
        logActivity("Preis pro Getränk: " + euro(state.price) + " → " + euro(v));
        state.price = v; save(); updateTopbar();
      }
    });
    priceRow.appendChild(priceInput);
    settingsCard.appendChild(priceRow);

    var exportRow = el("div", { class: "settings-item" });
    exportRow.appendChild(el("div", {}, [el("div", { class: "lbl" }, [text("Backup exportieren")]), el("div", { class: "hint" }, [text("Als Datei speichern")])]));
    var exportBtn = el("button", { class: "btn-secondary" }, [text("Export")]);
    exportBtn.addEventListener("click", function () {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a"); a.href = url; a.download = "hotpigs-kasse-backup.json"; a.click();
      URL.revokeObjectURL(url);
    });
    exportRow.appendChild(exportBtn);
    settingsCard.appendChild(exportRow);

    var importRow = el("div", { class: "settings-item" });
    importRow.appendChild(el("div", {}, [el("div", { class: "lbl" }, [text("Backup importieren")]), el("div", { class: "hint" }, [text("Ersetzt alle aktuellen Daten")])]));
    var importInput = el("input", { type: "file", accept: "application/json", style: "display:none;" });
    importInput.addEventListener("change", function (e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          if (!data.people) throw new Error("ungültig");
          if (!confirm("Backup importieren und aktuelle Daten überschreiben?")) return;
          state = data; save(); renderMain();
        } catch (err) { alert("Diese Datei konnte nicht gelesen werden."); }
      };
      reader.readAsText(file);
    });
    var importBtn = el("button", { class: "btn-secondary" }, [text("Import")]);
    importBtn.addEventListener("click", function () { importInput.click(); });
    importRow.appendChild(importBtn); importRow.appendChild(importInput);
    settingsCard.appendChild(importRow);

    var resetRow = el("div", { class: "settings-item" });
    resetRow.appendChild(el("div", {}, [el("div", { class: "lbl" }, [text("Alles zurücksetzen")]), el("div", { class: "hint" }, [text("Löscht alle Daten unwiderruflich")])]));
    var resetBtn = el("button", { class: "btn-secondary btn-danger" }, [text("Zurücksetzen")]);
    resetBtn.addEventListener("click", function () {
      if (!confirm("Wirklich ALLE Daten löschen? Das kann nicht rückgängig gemacht werden.")) return;
      if (!confirm("Ganz sicher? Personen, Strichlisten und Verlauf werden komplett gelöscht.")) return;
      state = defaultState(); state.history = []; state.period.einkaufe = [];
      state.people.forEach(function (p) { state.period.drinks[p.id] = 0; state.period.vortrag[p.id] = 0; });
      save(); renderMain();
    });
    resetRow.appendChild(resetBtn);
    settingsCard.appendChild(resetRow);

    wrap.appendChild(settingsCard);
    return wrap;
  }

  // ---------- Modal: Periode abschließen ----------

  function openCloseModal() {
    var monthNames = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
    var now = new Date();
    var suggestion = monthNames[now.getMonth()] + " " + now.getFullYear();

    var overlay = el("div", { class: "overlay" });
    var sheet = el("div", { class: "sheet" });
    sheet.appendChild(el("h3", {}, [text("Abrechnung erzeugen")]));
    sheet.appendChild(el("p", { style: "margin:0 0 10px;color:var(--ink-muted);font-size:0.88rem;" },
      [text("Alle aktuellen Salden werden im Verlauf gespeichert, \"Erfassen\" wird auf Null gesetzt und der PDF-Export öffnet sich automatisch.")]));
    var field = el("div", { class: "field" }, [el("label", {}, [text("Bezeichnung")])]);
    var input = el("input", { type: "text", value: suggestion });
    field.appendChild(input);
    sheet.appendChild(field);

    var actions = el("div", { class: "sheet-actions" });
    var cancel = el("button", { class: "btn-secondary" }, [text("Abbrechen")]);
    cancel.addEventListener("click", function () { overlay.remove(); });
    var confirmBtn = el("button", { class: "btn-primary" }, [text("Abrechnung erzeugen")]);
    confirmBtn.addEventListener("click", function () {
      var label = input.value.trim() || suggestion;
      var rows = state.people.map(function (p) {
        var c = personCalc(p);
        return { name: p.name, verbraucht: c.verbraucht, guthaben: c.guthaben };
      });
      var entry = { id: uid(), label: label, closedAt: new Date().toISOString(), price: state.price, rows: rows };
      state.history.unshift(entry);
      logActivity("Abrechnung erzeugt: " + label);
      lastQuickAction = null;

      var newVortrag = {};
      state.people.forEach(function (p) { newVortrag[p.id] = personCalc(p).guthaben; });
      state.period = { startedAt: new Date().toISOString(), vortrag: newVortrag, drinks: {}, einkaufe: [] };
      state.people.forEach(function (p) { state.period.drinks[p.id] = 0; });

      save(); overlay.remove(); currentView = "verlauf"; renderMain(); renderTabs();
      printAbrechnung(entry);
    });
    actions.appendChild(cancel); actions.appendChild(confirmBtn);
    sheet.appendChild(actions);

    overlay.appendChild(sheet);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
  }

  // ---------- Router ----------

  var VIEWS = { erfassen: viewErfassen, einkaeufe: viewEinkaeufe, saldo: viewSaldo, verlauf: viewVerlauf, verwalten: viewVerwalten };

  function renderMain() {
    var main = document.getElementById("main");
    main.innerHTML = "";
    main.appendChild(VIEWS[currentView]());
    updateTopbar();
  }

  function renderTabs() {
    document.querySelectorAll(".tab-btn").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-view") === currentView);
    });
  }

  document.getElementById("tabbar").addEventListener("click", function (e) {
    var btn = e.target.closest(".tab-btn");
    if (!btn) return;
    var nextView = btn.getAttribute("data-view");
    if (nextView !== "erfassen") lastQuickAction = null;
    currentView = nextView;
    searchTerm = "";
    renderTabs(); renderMain();
    document.getElementById("main").scrollTop = 0;
  });

  renderTabs();
  renderMain();

  fetchServerState(true);
  setInterval(function () { fetchServerState(false); }, 8000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") fetchServerState(false);
  });
})();
</script>
